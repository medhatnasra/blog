name: test-flows-pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-api/package-lock.json
      - run: npm ci
      - run: npm test
  test-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-front

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-front/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: false
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [test-api, test-front]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./blog-api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./blog-front
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blog-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
